name: Restore cache
description: Restore the distfiles, npm, yarn, pnpm, cargo, go and ccache directories from the cache

inputs:
  digest:
    description: Hash of changed files
    required: true
  restore-keys:
    description: Fallback cache keys
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Prepare cache paths
      id: paths
      shell: bash
      run: |
        {
          echo 'path<<EOF'
          echo "${GITHUB_WORKSPACE}/distfiles"
          echo "${GITHUB_WORKSPACE}/npm-cache"
          echo "${GITHUB_WORKSPACE}/yarn-cache"
          echo "${GITHUB_WORKSPACE}/pnpm-cache"
          echo "${GITHUB_WORKSPACE}/cargo-cache"
          echo "${GITHUB_WORKSPACE}/go-cache"
          echo "${GITHUB_WORKSPACE}/go-mod-cache"
          echo "${GITHUB_WORKSPACE}/ccache"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Restore cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.paths.outputs.path }}
        key: ${{ github.workflow }}-${{ inputs.digest }}
        restore-keys: ${{ inputs.restore-keys || github.workflow }}

    - name: Fix cache dir ownership
      shell: bash
      run: |
        sudo chown -R 250:250 "${GITHUB_WORKSPACE}/distfiles"
        sudo chown -R 250:250 "${GITHUB_WORKSPACE}/npm-cache"
        sudo chown -R 250:250 "${GITHUB_WORKSPACE}/yarn-cache"
        sudo chown -R 250:250 "${GITHUB_WORKSPACE}/pnpm-cache"
        sudo chown -R 250:250 "${GITHUB_WORKSPACE}/cargo-cache"
        sudo chown -R 250:250 "${GITHUB_WORKSPACE}/go-cache"
        sudo chown -R 250:250 "${GITHUB_WORKSPACE}/go-mod-cache"
        sudo chown -R 250:250 "${GITHUB_WORKSPACE}/ccache"

    - name: Show cache usage
      shell: bash
      run: |
        mapfile -t dirs <<< "${{ steps.paths.outputs.path }}"
        du -shc "${dirs[@]}"
