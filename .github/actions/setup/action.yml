name: Setup
description: Get changed files, resolve them to the ebuilds to build, prepare cache dirs

inputs:
  ebuilds:
    description: >-
      Pre-resolved space-separated ebuild list. When set, the changed-files
      detection is skipped and the list is passed through.
    default: ''

outputs:
  modified:
    description: List of changed files (deleted files excluded)
    value: ${{ steps.files.outputs.modified }}
  ebuilds:
    description: >-
      Space-separated ebuilds to build - the ones changed directly, the ones
      referencing a changed file, or (if nothing references the file) the
      last two ebuilds of the package
    value: ${{ steps.files.outputs.ebuilds }}
  build:
    description: Whether there is anything to build
    value: ${{ steps.files.outputs.build }}

runs:
  using: composite
  steps:
    - name: Get changed files
      id: changed-files
      if: ${{ inputs.ebuilds == '' }}
      uses: tj-actions/changed-files@v47

    - name: Prepare cache dir
      shell: bash
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/distfiles"
        mkdir -p "${GITHUB_WORKSPACE}/npm-cache"
        mkdir -p "${GITHUB_WORKSPACE}/yarn-cache"
        mkdir -p "${GITHUB_WORKSPACE}/pnpm-cache"
        mkdir -p "${GITHUB_WORKSPACE}/cargo-cache"
        mkdir -p "${GITHUB_WORKSPACE}/go-cache"
        mkdir -p "${GITHUB_WORKSPACE}/go-mod-cache"
        mkdir -p "${GITHUB_WORKSPACE}/ccache"

    - name: Prepare modified files' list
      id: files
      shell: bash
      run: |
        if [[ -n "${{ inputs.ebuilds }}" ]]; then
          # the list was already resolved (by the filter job), pass it through
          modified=""
          ebuilds="${{ inputs.ebuilds }}"
        else
          # tj-actions emits a space-separated list; normalize to one file per line
          all=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n')
          modified=$(echo "$all" | tr '\n' ' ')

          # deleted files are a separate output - a deleted ebuild can no longer
          # be built, but other deletions (files/, ...) still drive the
          # resolution: a dangling reference to a deleted file fails the build
          for d in ${{ steps.changed-files.outputs.deleted_files }}; do
            case "$d" in
              *.ebuild) ;;
              *) all+=$'\n'"$d" ;;
            esac
          done

          # resolve the ebuilds to build:
          # - ebuilds changed directly
          # - ebuilds referencing a changed non-ebuild file (the basename is
          #   grepped in the package dir; for a deleted file the reference
          #   still lives in the ebuild, so a dangling one fails the build)
          # - a file nothing references falls back to the last two ebuilds
          #   of the package (9999 + newest release)
          ebuilds=$(printf '%s\n' "$all" | grep -E '\.ebuild$' || true)
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            pkg=$(echo "$f" | cut -d/ -f1-2)
            name=$(basename "$f")
            # package-level Manifest/metadata.xml are bookkeeping, never build
            # inputs - they must not drive the resolution (a changed Manifest
            # would otherwise fall back to the last two ebuilds of the package)
            [[ "$f" = "$pkg/Manifest" || "$f" = "$pkg/metadata.xml" ]] && continue
            if [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]] \
               && refs=$(grep -lP "(?<![A-Za-z0-9._-])${name//./\\.}" "${pkg}"/*.ebuild 2>/dev/null); then
              ebuilds+=$'\n'"${refs}"
              continue
            fi
            ebuilds+=$'\n'"$(ls "${pkg}"/*.ebuild 2>/dev/null | sort -V | tail -2 || true)"
          done <<< "$(printf '%s\n' "$all" | grep -vE '\.ebuild$' || true)"
        fi
        ebuilds=$(echo "$ebuilds" | tr ' ' '\n' | grep -E '^[^ ]+\.ebuild$' | sort -du | tr '\n' ' ') || true
        ebuilds="${ebuilds% }"
        echo "modified=${modified}" >> $GITHUB_OUTPUT
        echo "ebuilds=${ebuilds}" >> $GITHUB_OUTPUT
        echo "build=$( [[ -n "$ebuilds" ]] && echo true || echo false )" >> $GITHUB_OUTPUT
