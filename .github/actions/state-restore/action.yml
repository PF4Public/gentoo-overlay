name: Restore state
description: >-
  Download the chunked state artifacts from a previous build job (or the
  newest set from an earlier run, for retries), verify the sha256 and
  extract the out/ dir back into the gentoo container

inputs:
  name:
    description: Artifact name prefix to restore (e.g. state-3)
    required: true
  src-dir:
    description: Absolute path inside the gentoo container to extract into (must exist)
    required: true

runs:
  using: composite
  steps:
    # 20 slots, must match the slot count of the deps-save/state-save action;
    # download-artifact only sees this run's artifacts
    - name: Download state chunk 00
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-00
        path: state-chunks/
    - name: Download state chunk 01
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-01
        path: state-chunks/
    - name: Download state chunk 02
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-02
        path: state-chunks/
    - name: Download state chunk 03
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-03
        path: state-chunks/
    - name: Download state chunk 04
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-04
        path: state-chunks/
    - name: Download state chunk 05
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-05
        path: state-chunks/
    - name: Download state chunk 06
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-06
        path: state-chunks/
    - name: Download state chunk 07
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-07
        path: state-chunks/
    - name: Download state chunk 08
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-08
        path: state-chunks/
    - name: Download state chunk 09
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-09
        path: state-chunks/
    - name: Download state chunk 10
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-10
        path: state-chunks/
    - name: Download state chunk 11
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-11
        path: state-chunks/
    - name: Download state chunk 12
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-12
        path: state-chunks/
    - name: Download state chunk 13
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-13
        path: state-chunks/
    - name: Download state chunk 14
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-14
        path: state-chunks/
    - name: Download state chunk 15
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-15
        path: state-chunks/
    - name: Download state chunk 16
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-16
        path: state-chunks/
    - name: Download state chunk 17
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-17
        path: state-chunks/
    - name: Download state chunk 18
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-18
        path: state-chunks/
    - name: Download state chunk 19
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-19
        path: state-chunks/
    - name: Reassemble and extract
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -uo pipefail
        p="${{ inputs.name }}"
        cd "${GITHUB_WORKSPACE}"

        fetch_meta() {
          local id
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"${p}-meta\") | .id" | head -1)
          [[ -n "$id" ]] || return 1
          local url
          url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" -i --jq '.location')
          curl -sfL "$url" -o /tmp/meta.zip
          rm -rf /tmp/meta-extract && mkdir -p /tmp/meta-extract
          unzip -o -q /tmp/meta.zip -d /tmp/meta-extract
          rm -f /tmp/meta.zip
          cat "/tmp/meta-extract/${p}-sha256"
        }

        mkdir -p state-chunks
        mapfile -t local < <(ls -1 state-chunks/ 2>/dev/null | grep "^${p}-" || true)
        if [[ ${#local[@]} -gt 0 ]]; then
          # this run produced a set, the meta must be in this run too
          echo "restoring ${#local[@]} chunk(s) from this run"
          sha256=$(fetch_meta) || { echo "local chunks but no meta (incomplete save), starting cold" >&2; exit 0; }
        else
          # no set in this run, fall back to the newest one from any run
          sha256=$(fetch_meta) || { echo "No state set found, starting without build state"; exit 0; }
          echo "restoring the newest state set from an earlier run"
          names=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].name' | grep "^${p}-" | grep -v -- "-meta$")
          for name in $names; do
            id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=$name&per_page=1" --jq '.artifacts[0].id')
            url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" -i --jq '.location')
            curl -sfL "$url" -o /tmp/chunk.zip
            unzip -o -q /tmp/chunk.zip -d state-chunks/
            rm -f /tmp/chunk.zip
          done
        fi

        mapfile -t files < <(ls -1 state-chunks/ | grep "^${p}-" | sort)
        actual=$(cat state-chunks/${p}-* | sha256sum | awk '{print $1}')
        if [[ "$actual" != "$sha256" ]]; then
          # corrupted or incomplete set: skip it rather than kill the build,
          # the next save supersedes it
          echo "WARNING: state checksum mismatch, not restoring, starting cold" >&2
          exit 0
        fi
        echo "Extracting build state from ${#files[@]} chunk(s)"
        command -v zstd > /dev/null || sudo apt-get install -y zstd > /dev/null
        cat state-chunks/${p}-* | zstd -d -q | docker exec -i gentoo tar -xpf - -C "${{ inputs.src-dir }}"
        docker exec gentoo du -sh "${{ inputs.src-dir }}/out"
        rm -rf "${GITHUB_WORKSPACE}/state-chunks"
