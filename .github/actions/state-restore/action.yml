name: Restore state
description: >-
  Download the chunked state artifacts of a previous build job of this run,
  verify the sha256 and extract the package's whole portage dir back into
  the gentoo container. State is run-scoped only: it is version-specific,
  so a set from another run is useless and never consulted.

inputs:
  name:
    description: Run-scoped artifact name prefix to restore (e.g. state-40732479379-3)
    required: true
  portage-dir:
    description: >-
      Absolute path of the package's portage build dir inside the container
      (e.g. /var/tmp/portage/dev-util/electron-44.9.3); the state extracts
      over it
    required: true
  src-dir:
    description: >-
      Absolute path of the source work dir inside the container (the dir
      that src_prepare moves the electron and node trees into)
    required: true

runs:
  using: composite
  steps:
    # 20 slots, must match the slot count of the deps-save/state-save action;
    # download-artifact only sees this run's artifacts
    - name: Download state chunk 00
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-00
        path: state-chunks/
    - name: Download state chunk 01
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-01
        path: state-chunks/
    - name: Download state chunk 02
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-02
        path: state-chunks/
    - name: Download state chunk 03
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-03
        path: state-chunks/
    - name: Download state chunk 04
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-04
        path: state-chunks/
    - name: Download state chunk 05
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-05
        path: state-chunks/
    - name: Download state chunk 06
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-06
        path: state-chunks/
    - name: Download state chunk 07
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-07
        path: state-chunks/
    - name: Download state chunk 08
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-08
        path: state-chunks/
    - name: Download state chunk 09
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-09
        path: state-chunks/
    - name: Download state chunk 10
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-10
        path: state-chunks/
    - name: Download state chunk 11
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-11
        path: state-chunks/
    - name: Download state chunk 12
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-12
        path: state-chunks/
    - name: Download state chunk 13
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-13
        path: state-chunks/
    - name: Download state chunk 14
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-14
        path: state-chunks/
    - name: Download state chunk 15
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-15
        path: state-chunks/
    - name: Download state chunk 16
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-16
        path: state-chunks/
    - name: Download state chunk 17
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-17
        path: state-chunks/
    - name: Download state chunk 18
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-18
        path: state-chunks/
    - name: Download state chunk 19
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}-19
        path: state-chunks/
    - name: Reassemble and extract
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -uo pipefail
        p="${{ inputs.name }}"
        cd "${GITHUB_WORKSPACE}"

        # name-filtered query: an unfiltered list is a 100-item newest-first
        # window and this repo shares artifacts with other workflows
        fetch_meta() {
          local id
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${p}-meta&per_page=100" --jq '.artifacts[0].id // empty')
          [[ -n "$id" ]] || return 1
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" > /tmp/meta.zip
          rm -rf /tmp/meta-extract && mkdir -p /tmp/meta-extract
          unzip -o -q /tmp/meta.zip -d /tmp/meta-extract
          rm -f /tmp/meta.zip
          cat "/tmp/meta-extract/${p}-sha256"
        }

        mkdir -p state-chunks
        mapfile -t local < <(ls -1 state-chunks/ 2>/dev/null | grep "^${p}-" || true)
        if [[ ${#local[@]} -eq 0 ]]; then
          # no set in this run: there is no cross-run fallback, state from
          # another run belongs to another version
          echo "No state set in this run, starting without build state"
          exit 0
        fi
        # the name is run-scoped, so the meta can only be from this run
        echo "restoring ${#local[@]} chunk(s) from this run"
        sha256=$(fetch_meta) || { echo "local chunks but no meta (incomplete save), starting cold" >&2; exit 0; }

        mapfile -t files < <(ls -1 state-chunks/ | grep "^${p}-" | sort)
        actual=$(cat state-chunks/${p}-* | sha256sum | awk '{print $1}')
        if [[ "$actual" != "$sha256" ]]; then
          # corrupted or incomplete set: skip it rather than kill the build,
          # the next save supersedes it
          echo "WARNING: state checksum mismatch, not restoring, starting cold" >&2
          exit 0
        fi
        echo "Extracting build state from ${#files[@]} chunk(s)"
        command -v zstd > /dev/null || sudo apt-get install -y zstd > /dev/null
        # the tar member is relative to /var/tmp/portage, so extract there;
        # portage creates the build dir when the build starts, which has
        # not happened yet, so create it for the extraction
        docker exec gentoo mkdir -p "${{ inputs.portage-dir }}"
        cat state-chunks/${p}-* | zstd -d -q | docker exec -i gentoo tar -xpf - -C /var/tmp/portage
        # src_prepare moves the freshly unpacked trees in with plain mv:
        #   mv work/<P> electron ; mv work/<NODE_P> third_party/electron_node
        # with the restored tree in place, mv would nest into the existing
        # dirs and bury the fresh (re-patched) source, and the nested
        # electron_node would break the @node/* TS resolution; drop the mv
        # target dirs so src_unpack/src_prepare rebuild them fresh. The
        # electron.d.ts source-root copy they carry is a build side effect
        # that the ebuild regenerates in src_configure.
        docker exec gentoo bash -c "rm -rf '${{ inputs.src-dir }}/electron' '${{ inputs.src-dir }}/third_party/electron_node'"
        # the ebuild build runs as the portage user (250), not root: hand
        # over the restored tree, otherwise src_unpack dies with
        # permission denied on the root-owned work dir
        docker exec gentoo chown -R 250:250 "${{ inputs.portage-dir }}"
        docker exec gentoo du -sh "${{ inputs.portage-dir }}"
        rm -rf "${GITHUB_WORKSPACE}/state-chunks"
