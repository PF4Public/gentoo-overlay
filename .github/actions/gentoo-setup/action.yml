name: Gentoo setup
description: Build and start the Gentoo stage3+portage build container

inputs:
  accept-keywords:
    description: >-
      package.accept_keywords lines to write, one "atom keyword" per line
      (e.g. "llvm-core/* ~amd64"); leave empty to skip
    required: false

runs:
  using: composite
  steps:
    # Build a stage3 image carrying a fresh, pre-synced portage tree (see the Dockerfile)
    - name: Build build image
      shell: bash
      run: |
        docker build -t gentoo-build "${GITHUB_ACTION_PATH}"

    - name: Start container
      shell: bash
      run: |
        docker run -d --name gentoo \
          -v "${GITHUB_WORKSPACE}:/workspace" \
          gentoo-build \
          sleep infinity
        docker exec gentoo bash -c 'uname -a; emerge --version | head -1'

    - name: Configure portage
      shell: bash
      run: |
        set -euo pipefail

        # the official binhost binaries are built with the desktop profile
        # (its USE carries X, gtk, qt6, ...), so build with it to match
        docker exec gentoo eselect profile set default/linux/amd64/23.0/desktop

        printf '%s\n' \
          'ACCEPT_KEYWORDS="amd64"' \
          'BINPKG_DEST_DIR="/workspace/binpkgs"' \
          'CCACHE_DIR="/workspace/ccache"' \
          'CCACHE_MAXSIZE="6G"' \
          'DISTDIR="/workspace/distfiles"' \
          'EMERGE_DEFAULT_OPTS="--nospinner --jobs 2"' \
          'FEATURES="${FEATURES} ccache getbinpkg buildpkg keepwork -network-sandbox"' \
          'MAKEOPTS="-j5 -l10"' \
          'NINJAOPTS="-k0 -j5 -l10"' \
          | docker exec -i gentoo bash -c 'cat >> /etc/portage/make.conf'

        # the official binhost only carries stable ebuilds, so build with stable
        # keywords to maximize binpkg hits; the workflow passes the ~amd64
        # keywords its build needs (the release ebuild plus the testing-only
        # toolchain)
        if [[ -n "${{ inputs.accept-keywords }}" ]]; then
          docker exec -i gentoo bash -c 'cat > /tmp/accept-keywords' <<'EOF'
        ${{ inputs.accept-keywords }}
        EOF
          docker exec gentoo bash -c '
            f=/etc/portage/package.accept_keywords
            if [[ -d "$f" ]]; then
              mv /tmp/accept-keywords "$f/ci-build.conf"
            else
              cat /tmp/accept-keywords >> "$f"
            fi
          '
        fi

        # binrepos.conf and repos.conf may be a file or a directory of drop-ins
        # depending on the stage3, so handle both for each
        docker exec gentoo bash -c '
          f=/etc/portage/binrepos.conf
          if ! grep -rq "distfiles.gentoo.org" "$f" 2>/dev/null; then
            if [[ -d "$f" ]]; then
              printf "%s\n" "[gentoo-binhost]" "sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/" "layout = portage-2.2" > "$f/gentoo-binhost.conf"
            else
              printf "%s\n" "[gentoo-binhost]" "sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/" "layout = portage-2.2" >> "$f"
            fi
          fi
        '

        docker exec gentoo bash -c '
          f=/etc/portage/repos.conf
          if [[ -d "$f" ]]; then
            printf "%s\n" "[pf4public]" "location = /workspace" "priority = -1000" "auto-sync = false" > "$f/github.conf"
          else
            printf "%s\n" "[pf4public]" "location = /workspace" "priority = -1000" "auto-sync = false" >> "$f"
          fi
        '

        docker exec gentoo bash -c 'emerge --info | head -8'

    - name: Install build prerequisites
      shell: bash
      run: |
        docker exec gentoo emerge --getbinpkg -v1 \
          dev-util/ccache app-portage/getuto dev-vcs/git app-arch/zstd \
          sec-keys/openpgp-keys-gentoo-release

    - name: GPG keys for the binhost
      shell: bash
      run: |
        docker exec gentoo getuto -v || \
          echo "::warning::getuto failed, binhost signatures will not be verified"
