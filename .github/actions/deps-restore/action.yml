name: Restore deps
description: >-
  Download the chunked deps artifacts (the same run first, then the newest
  set from any earlier run) and verify the sha256 before extracting the dep
  dirs back into the workspace. Sets are atomic: the meta artifact is a
  pointer to one generation, whose chunk names are generation-scoped, so
  concurrent saves can never mix chunks of different sets.

inputs:
  prefix:
    description: Artifact name prefix, e.g. electron (-> electron-deps-<gen>-00)
    required: true

runs:
  using: composite
  steps:
    # the meta is a pointer (line 1: generation, line 2: expected sha256);
    # download-artifact only sees this run's artifacts, so a hit means an
    # earlier job of this run saved the set
    - name: Download deps meta
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-meta
        path: deps-chunks/

    - name: Read generation
      id: gen
      shell: bash
      run: |
        f="deps-chunks/${{ inputs.prefix }}-deps-sha256"
        if [[ -f "$f" ]]; then
          gen=$(sed -n 1p "$f")
          if [[ "$gen" =~ ^[0-9]+-[0-9]+-[0-9a-f]{6}$ ]]; then
            echo "this-run generation: $gen"
            echo "gen=$gen" >> "$GITHUB_OUTPUT"
          fi
        fi

    # 20 slots, must match the slot count of the deps-save action; the names
    # are generation-scoped, so a step either gets exactly this generation's
    # chunk or nothing (an empty gen yields a name that matches nothing)
    - name: Download deps chunk 00
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-00
        path: deps-chunks/
    - name: Download deps chunk 01
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-01
        path: deps-chunks/
    - name: Download deps chunk 02
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-02
        path: deps-chunks/
    - name: Download deps chunk 03
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-03
        path: deps-chunks/
    - name: Download deps chunk 04
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-04
        path: deps-chunks/
    - name: Download deps chunk 05
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-05
        path: deps-chunks/
    - name: Download deps chunk 06
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-06
        path: deps-chunks/
    - name: Download deps chunk 07
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-07
        path: deps-chunks/
    - name: Download deps chunk 08
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-08
        path: deps-chunks/
    - name: Download deps chunk 09
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-09
        path: deps-chunks/
    - name: Download deps chunk 10
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-10
        path: deps-chunks/
    - name: Download deps chunk 11
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-11
        path: deps-chunks/
    - name: Download deps chunk 12
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-12
        path: deps-chunks/
    - name: Download deps chunk 13
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-13
        path: deps-chunks/
    - name: Download deps chunk 14
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-14
        path: deps-chunks/
    - name: Download deps chunk 15
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-15
        path: deps-chunks/
    - name: Download deps chunk 16
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-16
        path: deps-chunks/
    - name: Download deps chunk 17
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-17
        path: deps-chunks/
    - name: Download deps chunk 18
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-18
        path: deps-chunks/
    - name: Download deps chunk 19
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prefix }}-deps-${{ steps.gen.outputs.gen }}-19
        path: deps-chunks/

    - name: Reassemble and extract
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -uo pipefail
        p="${{ inputs.prefix }}"
        cd "${GITHUB_WORKSPACE}"

        meta_file="deps-chunks/${p}-deps-sha256"

        # line 1 must be a generation, line 2 the expected sha256
        parse_meta() {
          local f="$1"
          GEN=$(sed -n 1p "$f")
          SHA=$(sed -n 2p "$f")
          [[ "$GEN" =~ ^[0-9]+-[0-9]+-[0-9a-f]{6}$ && "$SHA" =~ ^[0-9a-f]{64}$ ]]
        }

        # prefer the pointer from this run (a build job feeding the next),
        # fall back to the newest pointer from any run
        if [[ -f "$meta_file" ]] && parse_meta "$meta_file"; then
          echo "using generation $GEN from this run"
        else
          if [[ -f "$meta_file" ]]; then
            echo "local meta is not a valid pointer, fetching the newest" >&2
          fi
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${p}-deps-meta&per_page=1" --jq '.artifacts[0].id // empty' 2>/dev/null || true)
          if [[ -z "$id" ]]; then
            echo "No deps set found, starting cold"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" > /tmp/meta.zip
          rm -rf /tmp/meta-extract && mkdir -p /tmp/meta-extract
          unzip -o -q /tmp/meta.zip -d /tmp/meta-extract
          rm -f /tmp/meta.zip
          if ! parse_meta "/tmp/meta-extract/${p}-deps-sha256"; then
            echo "No valid deps pointer, starting cold"
            exit 0
          fi
          echo "using generation $GEN from an earlier run"
        fi

        # any chunk this run's download steps did not bring in is fetched by
        # its generation-scoped name (exactly one artifact can carry it)
        if ! ls "deps-chunks/${p}-deps-${GEN}-"* >/dev/null 2>&1; then
          mkdir -p deps-chunks
          for name in $(seq -w 0 19 | sed "s/^/${p}-deps-${GEN}-/"); do
            id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=$name&per_page=1" --jq '.artifacts[0].id // empty' 2>/dev/null || true)
            [[ -n "$id" ]] || continue
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" > /tmp/chunk.zip
            unzip -o -q /tmp/chunk.zip -d deps-chunks/
            rm -f /tmp/chunk.zip
          done
        fi

        mapfile -t files < <(ls -1 deps-chunks/ | grep "^${p}-deps-${GEN}-" | sort)
        if [[ ${#files[@]} -eq 0 ]]; then
          echo "WARNING: no chunks found for generation $GEN, starting cold" >&2
          exit 0
        fi
        actual=$(cat "deps-chunks/${p}-deps-${GEN}-"* | sha256sum | awk '{print $1}')
        if [[ "$actual" != "$SHA" ]]; then
          # corrupted or incomplete set: skip it rather than kill the build,
          # the next save supersedes it
          echo "WARNING: deps checksum mismatch (generation $GEN), not restoring, starting cold" >&2
          exit 0
        fi
        echo "Extracting deps set from ${#files[@]} chunk(s), generation $GEN"
        command -v zstd > /dev/null || sudo apt-get install -y zstd > /dev/null
        cat "deps-chunks/${p}-deps-${GEN}-"* | zstd -d -q | tar -xf - -C "${GITHUB_WORKSPACE}"

        for d in distfiles binpkgs npm-cache yarn-cache pnpm-cache cargo-cache go-cache go-mod-cache ccache; do
          [[ -d "${GITHUB_WORKSPACE}/$d" ]] && sudo chown -R 250:250 "${GITHUB_WORKSPACE}/$d"
        done
        du -shc "${GITHUB_WORKSPACE}"/distfiles "${GITHUB_WORKSPACE}"/binpkgs "${GITHUB_WORKSPACE}"/ccache 2>/dev/null || true
