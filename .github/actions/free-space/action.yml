name: Free space
description: Free up disk space on the runner and show the remaining space

runs:
  using: composite
  steps:
    - name: Free space on runner
      shell: bash
      run: |
        sudo rm -rf \
          /usr/local/.ghcup \
          /usr/local/lib/android \
          /usr/local/share/powershell \
          /usr/share/dotnet \
          /usr/share/swift \
          /opt/ghc \
          "$AGENT_TOOLSDIRECTORY"

    - name: Check free space (after cleanup)
      shell: bash
      run: df -h
