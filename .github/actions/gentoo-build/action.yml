name: Gentoo build
description: >-
  Build a package in the gentoo container: restore the cache and build state,
  apply the USE flags, run the timeout-bounded emerge, then save the state and
  package/upload the release artifact. The job only reports 'status'.

inputs:
  atom:
    description: Package atom to build (e.g. dev-util/electron)
    required: true
  use:
    description: USE flags (and USE_EXPAND settings) to apply for the atom
    required: true
  src-dir:
    description: Absolute path inside the gentoo container that contains the out/ dir
    required: true
  cache-key:
    description: distfiles/ccache cache key
    required: true
  build-timeout:
    description: Per-job build window for the emerge (e.g. 280m)
    required: true
  job:
    description: Build job number (1..6); state is restored from job-1 and saved as job
    required: true
    type: number
  accept-keywords:
    description: package.accept_keywords lines to write in the container (see gentoo-setup)
    required: false

outputs:
  status:
    description: Build status - complete, timeout or failed
    value: ${{ steps.build.outputs.status }}

runs:
  using: composite
  steps:
    - name: Restore cache
      uses: ./.github/actions/cache-restore
      with:
        key: ${{ inputs.cache-key }}

    - name: Gentoo setup
      uses: ./.github/actions/gentoo-setup
      with:
        accept-keywords: ${{ inputs.accept-keywords }}

    - name: Apply USE flags
      shell: bash
      run: |
        set -euo pipefail
        # package.use may be a directory of drop-ins; append to a drop-in in that case
        docker exec -e ATOM="${{ inputs.atom }}" -e USE="${{ inputs.use }}" gentoo \
          bash -c 'f=/etc/portage/package.use; [[ -d "$f" ]] && f="$f/ci-build.conf"; printf "%s %s\n" "$ATOM" "$USE" >> "$f"; tail -1 "$f"'

    - name: Compute artifact names
      id: names
      shell: bash
      run: |
        n=${{ inputs.job }}
        echo "restore=state-$((n - 1))" >> "$GITHUB_OUTPUT"
        echo "save=state-$n" >> "$GITHUB_OUTPUT"
        echo "log=build-log-$n" >> "$GITHUB_OUTPUT"

    - name: Restore build state
      uses: ./.github/actions/state-restore
      with:
        name: ${{ steps.names.outputs.restore }}
        src-dir: ${{ inputs.src-dir }}

    - name: Check dependency resolution (dry run)
      shell: bash
      run: |
        set -uo pipefail
        # fail fast on unsatisfiable deps/keywords instead of hours into the build;
        # -p mode cannot write the autounmask changes it reports ("... changes are
        # necessary to proceed"), so treat those as a warning - the real build
        # writes them via --autounmask-write; the || keeps the rc in a conditional
        # context, so the -e wrapper does not abort the step before it can be handled
        rc=0
        timeout 15m docker exec gentoo \
          emerge --getbinpkg --autounmask --autounmask-write --autounmask-continue -pv1 ${{ inputs.atom }} 2>&1 | tee dry-run.log || rc=$?
        if [[ $rc -ne 0 ]]; then
          if grep -q "changes are necessary to proceed" dry-run.log; then
            echo "::warning::dry run reports necessary USE/keyword changes, the build will autounmask them"
          else
            echo "dependency resolution failed" >&2
            exit 1
          fi
        fi

    - name: Build
      id: build
      shell: bash
      run: |
        set -uo pipefail
        # stream to the job log too, the build is otherwise silent for hours;
        # the || keeps the rc in a conditional context, so the -e wrapper does
        # not abort the step on a timeout before it can be handled
        rc=0
        timeout ${{ inputs.build-timeout }} docker exec gentoo \
          emerge --getbinpkg --autounmask --autounmask-write --autounmask-continue -v1 ${{ inputs.atom }} 2>&1 | tee build.log || rc=$?
        if [[ $rc -eq 0 ]]; then
          status="complete"
        elif [[ $rc -eq 124 ]]; then
          status="timeout"
        else
          status="failed"
        fi
        echo "status=${status}" >> "$GITHUB_OUTPUT"
        if [[ $status == "failed" ]]; then
          exit 1
        fi
        if [[ $status == "timeout" ]]; then
          # kill lingering build processes, the next job resumes
          docker exec gentoo pkill -f 'ninja|emerge|ebuild' > /dev/null 2>&1 || true
          sleep 5
        fi

    - name: Upload build log
      if: failure() && hashFiles('build.log')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.names.outputs.log }}
        path: build.log
        retention-days: 3

    - name: Save build state
      if: failure() || steps.build.outputs.status == 'timeout'
      uses: ./.github/actions/state-save
      with:
        name: ${{ steps.names.outputs.save }}
        src-dir: ${{ inputs.src-dir }}

    - name: Package release artifact
      if: steps.build.outputs.status == 'complete'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p release
        docker exec -e ATOM="${{ inputs.atom }}" -w / gentoo \
          bash -c 'qlist -ev "$ATOM" | sed "s|^/||" | tar -cjf /workspace/release/x86-64.tar.bz2 -T -'
        docker exec gentoo du -sh /workspace/release/x86-64.tar.bz2

    - name: Upload release artifact
      if: steps.build.outputs.status == 'complete'
      uses: actions/upload-artifact@v7
      with:
        name: release
        path: release/x86-64.tar.bz2
        retention-days: 30

    - name: Save cache
      if: always()
      uses: ./.github/actions/cache-save
      with:
        key: ${{ inputs.cache-key }}
