name: Gentoo build
description: >-
  Build a package in the gentoo container: restore the shared deps, install
  the atom's dependencies only, restore the run's build state (the whole
  portage dir of the package), run the timeout-bounded emerge with keepwork,
  then save the state, package/upload the release artifact and save the deps.
  The job only reports 'status'.

inputs:
  atom:
    description: Package atom to build (e.g. =dev-util/electron-44.9.3)
    required: true
  use:
    description: USE flags (and USE_EXPAND settings) to apply for the atom
    required: true
  portage-dir:
    description: >-
      Absolute path of the package's portage build dir inside the container
      (e.g. /var/tmp/portage/dev-util/electron-44.9.3); this whole dir is
      the build state
    required: true
  src-dir:
    description: >-
      Absolute path of the source work dir inside the container (the dir
      that src_prepare moves the electron and node trees into)
    required: true
  deps-prefix:
    description: deps artifact name prefix (e.g. electron)
    required: true
  build-timeout:
    description: Per-job build window for the emerge (e.g. 280m)
    required: true
  job:
    description: Build job number (1..7); state is restored from job-1 and saved as job
    required: true
    type: number
  accept-keywords:
    description: package.accept_keywords lines to write in the container (see gentoo-setup)
    required: false

outputs:
  status:
    description: Build status - complete, timeout or failed
    value: ${{ steps.build.outputs.status }}

runs:
  using: composite
  steps:
    - name: Restore deps
      uses: ./.github/actions/deps-restore
      with:
        prefix: ${{ inputs.deps-prefix }}

    - name: Gentoo setup
      uses: ./.github/actions/gentoo-setup
      with:
        accept-keywords: ${{ inputs.accept-keywords }}

    - name: Apply USE flags
      shell: bash
      run: |
        set -euo pipefail
        # package.use may be a directory of drop-ins; append to a drop-in in that case
        docker exec -e ATOM="${{ inputs.atom }}" -e USE="${{ inputs.use }}" gentoo \
          bash -c 'f=/etc/portage/package.use; [[ -d "$f" ]] && f="$f/ci-build.conf"; printf "%s %s\n" "$ATOM" "$USE" >> "$f"; tail -1 "$f"'

    - name: Compute artifact names
      id: names
      shell: bash
      run: |
        n=${{ inputs.job }}
        # state is run-scoped: it is version-specific, so a set from another
        # run (even the same job number) is worthless and must not be used
        echo "restore=state-${GITHUB_RUN_ID}-$((n - 1))" >> "$GITHUB_OUTPUT"
        echo "save=state-${GITHUB_RUN_ID}-$n" >> "$GITHUB_OUTPUT"
        echo "log=build-log-$n" >> "$GITHUB_OUTPUT"

    - name: Build dependencies
      id: deps
      shell: bash
      run: |
        set -uo pipefail
        # install the atom's dependencies only (--onlydeps): getbinpkg for
        # the binary ones, buildpkg to save the source-built ones for the
        # next runs. The window is small on purpose: a cold (no ccache/
        # binpkg) toolchain is far longer, on timeout the in-progress build
        # is killed and the Build step picks the rest up in its own window,
        # so every job works at full speed, cold or warm; 25m + 280m build
        # + the restores/saves still fits the 355m job cap
        rc=0
        timeout 25m docker exec gentoo \
          emerge --getbinpkg --buildpkg --onlydeps --autounmask --autounmask-write --autounmask-continue -v1 \
          ${{ inputs.atom }} 2>&1 | tee deps.log || rc=$?
        if [[ $rc -eq 124 ]]; then
          echo "dependency build timed out, the Build step continues it" >&2
          tail -40 deps.log
          # kill the in-progress builds, then wait for the killed emerge to
          # finish its graceful shutdown: it keeps cleaning up the in-
          # progress package for a while after the pkill, and the Build step
          # re-emerges in this same container, so a stale workdir (or a still
          # cleaning emerge) makes the resume fail within seconds. The
          # half-built (unmerged) packages are dropped, portage redoes them
          # from scratch. A dir killed after configure must be dropped
          # entirely: portage wipes ${T} on the new emerge run, the
          # .configured marker makes it skip src_configure, and build
          # systems whose configure state lives in ${T} (meson's machine
          # .ini files) then die in ninja's regenerate. Pretended but
          # unconfigured dirs are safe to keep (the resume re-runs
          # configure) and save the unpack
          docker exec gentoo pkill -f 'ninja|emerge|ebuild' > /dev/null 2>&1 || true
          for i in $(seq 30); do
            docker exec gentoo pgrep -f 'emerge|ninja|ebuild' > /dev/null 2>&1 || break
            sleep 2
          done
          docker exec gentoo bash -c 'find /var/tmp/portage -mindepth 2 -maxdepth 2 -type d ! -path "'"${{ inputs.portage-dir }}"'" -print0 | while IFS= read -r -d "" d; do if [[ ! -e "$d/.merged" && ( -e "$d/.configured" || ! -e "$d/.pretended" ) ]]; then rm -rf "$d"; fi; done' || true
        elif [[ $rc -ne 0 ]]; then
          echo "dependency installation failed" >&2
          tail -40 deps.log
          exit 1
        else
          echo "dependencies installed"
        fi

    - name: Restore build state
      uses: ./.github/actions/state-restore
      with:
        name: ${{ steps.names.outputs.restore }}
        portage-dir: ${{ inputs.portage-dir }}
        src-dir: ${{ inputs.src-dir }}

    - name: Build
      id: build
      shell: bash
      run: |
        set -uo pipefail
        # deps are already installed; keepwork keeps the workdir so the next
        # job resumes; --buildpkg-exclude keeps the atom out of the shared
        # binpkgs (version-specific, useless to other runs); stream to the
        # job log too, the build is otherwise silent for hours; the || keeps
        # the rc in a conditional context, so the -e wrapper does not abort
        # the step on a timeout before it can be handled.
        #
        # Two minutes before the window ends, a deadline timer kills only the
        # build orchestrators (ninja/make) in the container. The ebuild then
        # fails through its normal failure path, where keepwork preserves the
        # workdir, and the next job resumes right where this one stopped. A
        # hard pkill of emerge/ebuild at the window end instead trips
        # portage's kill cleanup, which drops the in-progress workdir and
        # loses the job's whole progress (seen on electron, whose partial
        # ninja state is the resume point). The hard timeout below remains as
        # a backstop for a build that ignores the kill.
        bt="${{ inputs.build-timeout }}"
        deadline_file="${GITHUB_WORKSPACE}/deadline-hit"
        rm -f "$deadline_file"
        (
          sleep $(( ( ${bt%m} - 2 ) * 60 ))
          touch "$deadline_file"
          docker exec gentoo bash -c 'pkill -x ninja; pkill -x make; pkill -x bmake' > /dev/null 2>&1 || true
        ) &
        deadline_pid=$!
        rc=0
        timeout "${bt}" docker exec gentoo \
          emerge --getbinpkg --buildpkg --buildpkg-exclude "${{ inputs.atom }}" \
          --autounmask --autounmask-write --autounmask-continue -v1 ${{ inputs.atom }} 2>&1 | tee build.log || rc=$?
        kill "$deadline_pid" 2> /dev/null || true
        if [[ $rc -eq 0 ]]; then
          status="complete"
        elif [[ $rc -eq 124 ]]; then
          status="timeout"
        elif [[ -f "$deadline_file" ]]; then
          # the deadline kill failed the in-progress ebuild; portage already
          # reported it and exited, keepwork preserved the workdir
          status="timeout"
        else
          status="failed"
        fi
        echo "status=${status}" >> "$GITHUB_OUTPUT"
        # the job log is what is actually read; log artifacts can lag a long
        # time, and the tail is where the failure is
        echo "=== tail of build.log ==="
        tail -n 200 build.log
        grep -a "^FAILED:\|ninja: build stopped" build.log | tail -n 30 || true
        if [[ $status == "failed" ]]; then
          exit 1
        fi
        if [[ $status == "timeout" ]]; then
          # kill lingering build processes and wait for the shutdown, so
          # the state/deps saves below do not race the dying processes
          # (a tar reading a still-written ccache fails with "file changed");
          # on a deadline timeout the orchestrators are already dead and only
          # orphaned compiler jobs may still be flushing translation units
          docker exec gentoo pkill -f 'ninja|emerge|ebuild' > /dev/null 2>&1 || true
          for i in $(seq 60); do
            docker exec gentoo pgrep -f 'ninja|emerge|ebuild|clang' > /dev/null 2>&1 || break
            sleep 2
          done
        fi

    - name: Upload build log
      if: failure() && hashFiles('build.log')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.names.outputs.log }}
        path: build.log
        retention-days: 3

    - name: Save build state
      if: failure() || steps.build.outputs.status == 'timeout'
      uses: ./.github/actions/state-save
      with:
        name: ${{ steps.names.outputs.save }}
        portage-dir: ${{ inputs.portage-dir }}

    - name: Package release artifact
      if: steps.build.outputs.status == 'complete'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p release
        # tar the installed file list into a plain bzip2 tarball (cwd / so
        # the relative paths resolve); the -bin ebuilds unpack it and read
        # the usr/ tree. No -v on qlist: it would emit a "<atom> CONTENTS:"
        # header line that breaks tar -T
        docker exec -e ATOM="${{ inputs.atom }}" -w / gentoo \
          bash -c 'set -euo pipefail
            qlist -e "${ATOM}" | sed "s|^/||" | tar -cjf /workspace/release/x86-64.tar.bz2 -T -'
        docker exec gentoo du -sh /workspace/release/x86-64.tar.bz2

    - name: Upload release artifact
      if: steps.build.outputs.status == 'complete'
      uses: actions/upload-artifact@v7
      with:
        name: release
        path: release/x86-64.tar.bz2
        retention-days: 30

    # only on failure/timeout: a completing job is the last one, and
    # re-saving the unchanged warm set would cost ~15m of upload per job
    - name: Save deps
      if: failure() || steps.build.outputs.status == 'timeout'
      uses: ./.github/actions/deps-save
      with:
        prefix: ${{ inputs.deps-prefix }}
