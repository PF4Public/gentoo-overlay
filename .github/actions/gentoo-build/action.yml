name: Gentoo build
description: >-
  Build a package in the gentoo container: restore the shared deps, install
  the atom's dependencies only, restore the run's build state (the whole
  portage dir of the package), run the timeout-bounded emerge with keepwork,
  then save the state, package/upload the release artifact and save the deps.
  The job only reports 'status'.

inputs:
  atom:
    description: Package atom to build (e.g. =dev-util/electron-44.9.3)
    required: true
  use:
    description: USE flags (and USE_EXPAND settings) to apply for the atom
    required: true
  portage-dir:
    description: >-
      Absolute path of the package's portage build dir inside the container
      (e.g. /var/tmp/portage/dev-util/electron-44.9.3); this whole dir is
      the build state
    required: true
  src-dir:
    description: >-
      Absolute path of the source work dir inside the container (the dir
      that src_prepare moves the electron and node trees into)
    required: true
  deps-prefix:
    description: deps artifact name prefix (e.g. electron)
    required: true
  build-timeout:
    description: Per-job build window for the emerge (e.g. 280m)
    required: true
  job:
    description: Build job number (1..7); state is restored from job-1 and saved as job
    required: true
    type: number
  accept-keywords:
    description: package.accept_keywords lines to write in the container (see gentoo-setup)
    required: false

outputs:
  status:
    description: Build status - complete, timeout or failed
    value: ${{ steps.build.outputs.status }}

runs:
  using: composite
  steps:
    - name: Restore deps
      uses: ./.github/actions/deps-restore
      with:
        prefix: ${{ inputs.deps-prefix }}

    - name: Gentoo setup
      uses: ./.github/actions/gentoo-setup
      with:
        accept-keywords: ${{ inputs.accept-keywords }}

    - name: Apply USE flags
      shell: bash
      run: |
        set -euo pipefail
        # package.use may be a directory of drop-ins; append to a drop-in in that case
        docker exec -e ATOM="${{ inputs.atom }}" -e USE="${{ inputs.use }}" gentoo \
          bash -c 'f=/etc/portage/package.use; [[ -d "$f" ]] && f="$f/ci-build.conf"; printf "%s %s\n" "$ATOM" "$USE" >> "$f"; tail -1 "$f"'

    - name: Compute artifact names
      id: names
      shell: bash
      run: |
        n=${{ inputs.job }}
        # state is run-scoped: it is version-specific, so a set from another
        # run (even the same job number) is worthless and must not be used
        echo "restore=state-${GITHUB_RUN_ID}-$((n - 1))" >> "$GITHUB_OUTPUT"
        echo "save=state-${GITHUB_RUN_ID}-$n" >> "$GITHUB_OUTPUT"
        echo "log=build-log-$n" >> "$GITHUB_OUTPUT"

    - name: Build dependencies
      shell: bash
      run: |
        set -uo pipefail
        # install the atom's dependencies only (--onlydeps): getbinpkg for
        # the binary ones, buildpkg to save the source-built ones for the
        # next runs; the atom itself is built in the Build step from the
        # restored state. The window is bounded: a cold (no ccache/binpkg)
        # dep build is longer, and the next job retries with the saved deps
        # artifacts
        rc=0
        timeout 90m docker exec gentoo \
          emerge --getbinpkg --buildpkg --onlydeps --autounmask --autounmask-write --autounmask-continue -v1 \
          ${{ inputs.atom }} 2>&1 | tee deps.log || rc=$?
        if [[ $rc -ne 0 ]]; then
          echo "dependency installation failed" >&2
          tail -40 deps.log
          exit 1
        fi
        echo "dependencies installed"

    - name: Restore build state
      uses: ./.github/actions/state-restore
      with:
        name: ${{ steps.names.outputs.restore }}
        portage-dir: ${{ inputs.portage-dir }}
        src-dir: ${{ inputs.src-dir }}

    - name: Build
      id: build
      shell: bash
      run: |
        set -uo pipefail
        # deps are already installed; keepwork keeps the workdir so the next
        # job resumes; --buildpkg-exclude keeps the atom out of the shared
        # binpkgs (version-specific, useless to other runs); stream to the
        # job log too, the build is otherwise silent for hours; the || keeps
        # the rc in a conditional context, so the -e wrapper does not abort
        # the step on a timeout before it can be handled
        rc=0
        timeout ${{ inputs.build-timeout }} docker exec gentoo \
          emerge --getbinpkg --buildpkg --buildpkg-exclude "${{ inputs.atom }}" \
          --autounmask --autounmask-write --autounmask-continue -v1 ${{ inputs.atom }} 2>&1 | tee build.log || rc=$?
        if [[ $rc -eq 0 ]]; then
          status="complete"
        elif [[ $rc -eq 124 ]]; then
          status="timeout"
        else
          status="failed"
        fi
        echo "status=${status}" >> "$GITHUB_OUTPUT"
        # the job log is what is actually read; log artifacts can lag a long
        # time, and the tail is where the failure is
        echo "=== tail of build.log ==="
        tail -n 200 build.log
        grep -a "^FAILED:\|ninja: build stopped" build.log | tail -n 30 || true
        if [[ $status == "failed" ]]; then
          exit 1
        fi
        if [[ $status == "timeout" ]]; then
          # kill lingering build processes, the next job resumes
          docker exec gentoo pkill -f 'ninja|emerge|ebuild' > /dev/null 2>&1 || true
          sleep 5
        fi

    - name: Upload build log
      if: failure() && hashFiles('build.log')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.names.outputs.log }}
        path: build.log
        retention-days: 3

    - name: Save build state
      if: failure() || steps.build.outputs.status == 'timeout'
      uses: ./.github/actions/state-save
      with:
        name: ${{ steps.names.outputs.save }}
        portage-dir: ${{ inputs.portage-dir }}

    - name: Package release artifact
      if: steps.build.outputs.status == 'complete'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p release
        docker exec -e ATOM="${{ inputs.atom }}" -w / gentoo \
          bash -c 'qlist -ev "$ATOM" | sed "s|^/||" | tar -cjf /workspace/release/x86-64.tar.bz2 -T -'
        docker exec gentoo du -sh /workspace/release/x86-64.tar.bz2

    - name: Upload release artifact
      if: steps.build.outputs.status == 'complete'
      uses: actions/upload-artifact@v7
      with:
        name: release
        path: release/x86-64.tar.bz2
        retention-days: 30

    - name: Save deps
      if: always()
      uses: ./.github/actions/deps-save
      with:
        prefix: ${{ inputs.deps-prefix }}
