name: whisper-cpp
on:
  push:
    branches:
    - master
    paths:
    - 'sci-misc/whisper-cpp/*.ebuild'
    - '.github/workflows/whisper-cpp.yml'
  pull_request:
    paths:
    - 'sci-misc/whisper-cpp/*.ebuild'
    - '.github/workflows/whisper-cpp.yml'
  workflow_dispatch:

jobs:
  default:
    if: github.repository == 'PF4Public/gentoo-overlay'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      # no changed ebuilds (workflow edit or manual dispatch): build all of them
      - name: Resolve ebuild list
        id: ebuilds
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list="sci-misc/whisper-cpp/whisper-cpp-1.9.5.ebuild sci-misc/whisper-cpp/whisper-cpp-9999.ebuild"
          else
            list="${{ steps.setup.outputs.modified }}"
            if ! grep -q '\.ebuild' <<< "$list"; then
              list="sci-misc/whisper-cpp/whisper-cpp-1.9.5.ebuild sci-misc/whisper-cpp/whisper-cpp-9999.ebuild"
            fi
          fi
          echo "list=${list}" >> "$GITHUB_OUTPUT"

      - name: Restore cache
        uses: ./.github/actions/cache-restore

      - name: Install ${{ github.workflow }} with default USE-flags
        uses: pf4public/gentoo-docker-action@master
        with:
            modified: ${{ steps.ebuilds.outputs.list }}
            tool: ebuild
            action: install
            params: ' '

      - name: Save cache
        if: ${{ always() }}
        uses: ./.github/actions/cache-save

  ebuild:
    needs: default
    if: github.repository == 'PF4Public/gentoo-overlay'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the gentoo-docker-action runs 'ebuild install' without resolving
        # dependencies, so only test flags whose packages are in the base image
        use:
          - 'ffmpeg'
          - 'sdl'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      # no changed ebuilds (workflow edit or manual dispatch): build all of them
      - name: Resolve ebuild list
        id: ebuilds
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list="sci-misc/whisper-cpp/whisper-cpp-1.9.5.ebuild sci-misc/whisper-cpp/whisper-cpp-9999.ebuild"
          else
            list="${{ steps.setup.outputs.modified }}"
            if ! grep -q '\.ebuild' <<< "$list"; then
              list="sci-misc/whisper-cpp/whisper-cpp-1.9.5.ebuild sci-misc/whisper-cpp/whisper-cpp-9999.ebuild"
            fi
          fi
          echo "list=${list}" >> "$GITHUB_OUTPUT"

      - name: Restore cache
        uses: ./.github/actions/cache-restore

      - name: Install ${{ github.workflow }} with "${{ matrix.use }}"
        uses: pf4public/gentoo-docker-action@master
        with:
            modified: ${{ steps.ebuilds.outputs.list }}
            tool: ebuild
            action: install
            params: ${{ matrix.use }}

      - name: Save cache
        if: ${{ always() }}
        uses: ./.github/actions/cache-save
