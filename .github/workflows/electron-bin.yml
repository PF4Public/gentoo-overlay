name: electron-bin
on:
  push:
    branches:
    - master
    paths:
    - 'dev-util/electron-bin/*.ebuild'
    - 'dev-util/electron-bin/files/**'
  pull_request:
    paths:
    - 'dev-util/electron-bin/*.ebuild'
    - 'dev-util/electron-bin/files/**'
  workflow_dispatch:
    inputs:
      ebuild:
        description: "Ebuild to build (default: newest)"
        required: false
        default: ''

jobs:
  filter:
    if: github.repository == 'PF4Public/gentoo-overlay'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.setup.outputs.build }}
      ebuilds: ${{ steps.setup.outputs.ebuilds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select ebuild
        id: select
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          # a dispatched run has no event diff for changed-files to work on,
          # so the ebuild to build is given explicitly (or the newest one)
          e="${{ github.event.inputs.ebuild }}"
          [[ -n "$e" ]] || e=$(ls dev-util/electron-bin/*.ebuild | sort -V | tail -1)
          echo "ebuilds=$e" >> "$GITHUB_OUTPUT"

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          ebuilds: ${{ steps.select.outputs.ebuilds }}

  default:
    needs: filter
    if: github.repository == 'PF4Public/gentoo-overlay' && needs.filter.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          ebuilds: ${{ needs.filter.outputs.ebuilds }}

      - name: Restore cache
        uses: ./.github/actions/cache-restore

      - name: Install ${{ github.workflow }} with default USE-flags
        uses: pf4public/gentoo-docker-action@master
        with:
            modified: ${{ steps.setup.outputs.ebuilds }}
            tool: ebuild
            action: install
            params: ' '

      - name: Save cache
        if: ${{ always() }}
        uses: ./.github/actions/cache-save
