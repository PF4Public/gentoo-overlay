name: ungoogled-chromium-bin
on:
  push:
    branches:
    - master
    paths:
    - 'www-client/ungoogled-chromium-bin/*.ebuild'
    - 'www-client/ungoogled-chromium-bin/files/**'
  pull_request:
    paths:
    - 'www-client/ungoogled-chromium-bin/*.ebuild'
    - 'www-client/ungoogled-chromium-bin/files/**'
  workflow_dispatch:
    inputs:
      ebuild:
        description: "Ebuild to build (default: newest)"
        required: false
        default: ''

jobs:
  filter:
    if: github.repository == 'PF4Public/gentoo-overlay'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.setup.outputs.build }}
      ebuilds: ${{ steps.setup.outputs.ebuilds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select ebuild
        id: select
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          # a dispatched run has no event diff for changed-files to work on,
          # so the ebuild to build is given explicitly (or the newest one)
          e="${{ github.event.inputs.ebuild }}"
          [[ -n "$e" ]] || e=$(ls www-client/ungoogled-chromium-bin/*.ebuild | sort -V | tail -1)
          echo "ebuilds=$e" >> "$GITHUB_OUTPUT"

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          ebuilds: ${{ steps.select.outputs.ebuilds }}

  build:
    needs: filter
    if: github.repository == 'PF4Public/gentoo-overlay' && needs.filter.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve atoms
        id: atoms
        shell: bash
        run: |
          set -euo pipefail
          # build the ebuilds the filter resolved for this package (the ones
          # changed directly or via a changed files/ entry, the live 9999 among
          # them when it changed). Same-slot versions (a release + the 9999)
          # are not mergeable in one emerge, so emit one atom per line and let
          # the Build step run one emerge per line.
          pkgdir="www-client/ungoogled-chromium-bin"
          atoms=""
          for e in ${{ needs.filter.outputs.ebuilds }}; do
            [[ "$e" == "$pkgdir"/*.ebuild ]] || continue
            eb=$(basename "$e" .ebuild)
            atoms+="=$pkgdir-${eb#$(basename "$pkgdir")-}"$'\n'
          done
          atoms=$(printf '%s' "$atoms" | sed '/^$/d' | sort -u)
          if [[ -z "$atoms" ]]; then
            echo "atoms=" >> "$GITHUB_OUTPUT"
            echo "no ebuild of $pkgdir to build"
            exit 0
          fi
          { echo "atoms<<EOATOMS"; echo "$atoms"; echo "EOATOMS"; } >> "$GITHUB_OUTPUT"
          echo "building:"; echo "$atoms" | sed 's/^/  /'

      - name: Free space
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/free-space

      - name: Restore deps
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/deps-restore
        with:
          prefix: ci

      - name: Gentoo setup
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/gentoo-setup
        with:
          accept-keywords: |
            www-client/ungoogled-chromium-bin *

      - name: Build
        if: steps.atoms.outputs.atoms != ''
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          while IFS= read -r atom; do
            [[ -n "$atom" ]] || continue
            echo "building: $atom"
            docker exec gentoo \
              emerge --getbinpkg --buildpkg-exclude "$atom" \
              --autounmask --autounmask-write --autounmask-continue -v1 \
              "$atom" 2>&1 | tee -a build.log || rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              echo "build failed for $atom (rc=${rc})" >&2
              tail -80 build.log
              exit 1
            fi
          done <<< "${{ steps.atoms.outputs.atoms }}"
          echo "build succeeded"

      - name: Save deps
        if: always() && steps.atoms.outputs.atoms != ''
        continue-on-error: true
        uses: ./.github/actions/deps-save
        with:
          prefix: ci

  ebuild:
    needs: [filter, build]
    if: github.repository == 'PF4Public/gentoo-overlay' && needs.filter.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        use:
          - convert-dict
          - widevine

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve atoms
        id: atoms
        shell: bash
        run: |
          set -euo pipefail
          # build the ebuilds the filter resolved for this package (the ones
          # changed directly or via a changed files/ entry, the live 9999 among
          # them when it changed). Same-slot versions (a release + the 9999)
          # are not mergeable in one emerge, so emit one atom per line and let
          # the Build step run one emerge per line.
          pkgdir="www-client/ungoogled-chromium-bin"
          atoms=""
          for e in ${{ needs.filter.outputs.ebuilds }}; do
            [[ "$e" == "$pkgdir"/*.ebuild ]] || continue
            eb=$(basename "$e" .ebuild)
            atoms+="=$pkgdir-${eb#$(basename "$pkgdir")-}"$'\n'
          done
          atoms=$(printf '%s' "$atoms" | sed '/^$/d' | sort -u)
          if [[ -z "$atoms" ]]; then
            echo "atoms=" >> "$GITHUB_OUTPUT"
            echo "no ebuild of $pkgdir to build"
            exit 0
          fi
          { echo "atoms<<EOATOMS"; echo "$atoms"; echo "EOATOMS"; } >> "$GITHUB_OUTPUT"
          echo "building:"; echo "$atoms" | sed 's/^/  /'

      - name: Free space
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/free-space

      - name: Restore deps
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/deps-restore
        with:
          prefix: ci

      - name: Gentoo setup
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/gentoo-setup
        with:
          accept-keywords: |
            www-client/ungoogled-chromium-bin *

      - name: Apply USE flags
        if: steps.atoms.outputs.atoms != ''
        shell: bash
        run: |
          set -euo pipefail
          # package.use may be a directory of drop-ins; append to a drop-in in that case
          docker exec -e USE="${{ matrix.use }}" -e ATOMS="${{ steps.atoms.outputs.atoms }}" gentoo \
            bash -c 'f=/etc/portage/package.use; [[ -d "$f" ]] && f="$f/ci-build.conf"; printf "%s\n" "$ATOMS" | while IFS= read -r a; do [[ -n "$a" ]] && printf "%s %s\n" "$a" "$USE" >> "$f"; done; tail -n 5 "$f"'

      - name: Build
        if: steps.atoms.outputs.atoms != ''
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          while IFS= read -r atom; do
            [[ -n "$atom" ]] || continue
            echo "building: $atom"
            docker exec gentoo \
              emerge --getbinpkg --buildpkg-exclude "$atom" \
              --autounmask --autounmask-write --autounmask-continue -v1 \
              "$atom" 2>&1 | tee -a build.log || rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              echo "build failed for $atom (rc=${rc})" >&2
              tail -80 build.log
              exit 1
            fi
          done <<< "${{ steps.atoms.outputs.atoms }}"
          echo "build succeeded"

      - name: Save deps
        if: always() && steps.atoms.outputs.atoms != ''
        continue-on-error: true
        uses: ./.github/actions/deps-save
        with:
          prefix: ci
