name: sb-hosts
on:
  push:
    paths:
    - 'net-misc/sb-hosts/*.ebuild'
  pull_request:
    paths:
    - 'net-misc/sb-hosts/*.ebuild'

jobs:
  default:
    if: github.repository == 'PF4Public/gentoo-overlay'
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      - name: Install ${{ github.workflow }} with default USE-flags
        uses: pf4public/gentoo-docker-action@master
        with:
            modified: ${{ steps.setup.outputs.modified }}
            tool: ebuild
            action: install
            params: ' '

  ebuild:
    needs: default
    if: github.repository == 'PF4Public/gentoo-overlay'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use:
          - fakenews gambling porn social
          - fakenews gambling social
          - fakenews social
          - gambling

    steps:
      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      - name: Install ${{ github.workflow }} with "${{ matrix.use }}"
        uses: pf4public/gentoo-docker-action@master
        with:
            modified: ${{ steps.setup.outputs.modified }}
            tool: ebuild
            action: install
            params: ${{ matrix.use }}
