name: chromium-common
on:
  push:
    branches:
    - master
    paths:
    - 'www-client/chromium-common/*.ebuild'
    - 'www-client/chromium-common/files/**'
  pull_request:
    paths:
    - 'www-client/chromium-common/*.ebuild'
    - 'www-client/chromium-common/files/**'

jobs:
  filter:
    if: github.repository == 'PF4Public/gentoo-overlay'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.setup.outputs.build }}
      ebuilds: ${{ steps.setup.outputs.ebuilds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

  default:
    needs: filter
    if: github.repository == 'PF4Public/gentoo-overlay' && needs.filter.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          ebuilds: ${{ needs.filter.outputs.ebuilds }}

      - name: Install ${{ github.workflow }} with default USE-flags
        uses: pf4public/gentoo-docker-action@master
        with:
            modified: ${{ steps.setup.outputs.ebuilds }}
            tool: ebuild
            action: install
            params: ' '
