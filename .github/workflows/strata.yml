name: strata
on:
  push:
    branches:
    - master
    paths:
    - 'sci-misc/strata/*.ebuild'
    - 'sci-misc/strata/files/**'
  pull_request:
    paths:
    - 'sci-misc/strata/*.ebuild'
    - 'sci-misc/strata/files/**'
  workflow_dispatch:

jobs:
  filter:
    if: github.repository == 'PF4Public/gentoo-overlay'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.setup.outputs.build }}
      ebuilds: ${{ steps.setup.outputs.ebuilds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # a manual dispatch has no changed-file context; provide the package's
      # ebuilds (the last two: newest release + live) so the build can be
      # re-run on demand
      - name: Resolve (manual dispatch)
        id: resolve
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "ebuilds=$(ls sci-misc/strata/*.ebuild | sort -V | tail -2 | tr '\n' ' ' | sed 's/ $//')" >> "$GITHUB_OUTPUT"

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          ebuilds: ${{ steps.resolve.outputs.ebuilds }}

  default:
    needs: filter
    if: github.repository == 'PF4Public/gentoo-overlay' && needs.filter.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve atoms
        id: atoms
        shell: bash
        run: |
          set -euo pipefail
          # build the ebuilds the filter resolved for this package (the ones
          # changed directly or via a changed files/ entry, the live 9999 among
          # them when it changed). Same-slot versions (a release + the 9999)
          # are not mergeable in one emerge, so emit one atom per line and let
          # the Build step run one emerge per line.
          pkgdir="sci-misc/strata"
          atoms=""
          for e in ${{ needs.filter.outputs.ebuilds }}; do
            [[ "$e" == "$pkgdir"/*.ebuild ]] || continue
            eb=$(basename "$e" .ebuild)
            atoms+="=$pkgdir-${eb#$(basename "$pkgdir")-}"$'\n'
          done
          atoms=$(printf '%s' "$atoms" | sed '/^$/d' | sort -u)
          if [[ -z "$atoms" ]]; then
            echo "atoms=" >> "$GITHUB_OUTPUT"
            echo "no ebuild of $pkgdir to build"
            exit 0
          fi
          { echo "atoms<<EOATOMS"; echo "$atoms"; echo "EOATOMS"; } >> "$GITHUB_OUTPUT"
          echo "building:"; echo "$atoms" | sed 's/^/  /'

      - name: Free space
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/free-space

      - name: Restore deps
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/deps-restore
        with:
          prefix: ci

      - name: Gentoo setup
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/gentoo-setup
        with:
          accept-keywords: sci-misc/strata *

      # no cuda/hip job: the engine builds need a GPU toolkit, they are
      # for GPU systems
      - name: Build
        if: steps.atoms.outputs.atoms != ''
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          while IFS= read -r atom; do
            [[ -n "$atom" ]] || continue
            echo "building: $atom"
            docker exec gentoo \
              emerge --getbinpkg --buildpkg-exclude "$atom" \
              --autounmask --autounmask-write --autounmask-continue -v1 \
              "$atom" 2>&1 | tee -a build.log || rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              echo "build failed for $atom (rc=${rc})" >&2
              tail -80 build.log
              exit 1
            fi
          done <<< "${{ steps.atoms.outputs.atoms }}"
          echo "build succeeded"

      - name: Save deps
        if: always() && steps.atoms.outputs.atoms != ''
        continue-on-error: true
        uses: ./.github/actions/deps-save
        with:
          prefix: ci

  desktop:
    needs: [filter, default]
    if: github.repository == 'PF4Public/gentoo-overlay' && needs.filter.outputs.build == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    # webkit-gtk (the desktop's last dep, built from source) is ~4h cold;
    # 360 is the GH Actions per-job maximum
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve atoms
        id: atoms
        shell: bash
        run: |
          set -euo pipefail
          # build the ebuilds the filter resolved for this package (the ones
          # changed directly or via a changed files/ entry, the live 9999 among
          # them when it changed). Same-slot versions (a release + the 9999)
          # are not mergeable in one emerge, so emit one atom per line and let
          # the Build step run one emerge per line.
          pkgdir="sci-misc/strata"
          atoms=""
          for e in ${{ needs.filter.outputs.ebuilds }}; do
            [[ "$e" == "$pkgdir"/*.ebuild ]] || continue
            eb=$(basename "$e" .ebuild)
            atoms+="=$pkgdir-${eb#$(basename "$pkgdir")-}"$'\n'
          done
          atoms=$(printf '%s' "$atoms" | sed '/^$/d' | sort -u)
          if [[ -z "$atoms" ]]; then
            echo "atoms=" >> "$GITHUB_OUTPUT"
            echo "no ebuild of $pkgdir to build"
            exit 0
          fi
          { echo "atoms<<EOATOMS"; echo "$atoms"; echo "EOATOMS"; } >> "$GITHUB_OUTPUT"
          echo "building:"; echo "$atoms" | sed 's/^/  /'

      - name: Free space
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/free-space

      - name: Restore deps
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/deps-restore
        with:
          prefix: ci

      - name: Gentoo setup
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/gentoo-setup
        with:
          accept-keywords: sci-misc/strata *

      - name: Build (desktop)
        if: steps.atoms.outputs.atoms != ''
        shell: bash
        run: |
          set -uo pipefail
          docker exec gentoo bash -c \
            'echo "sci-misc/strata desktop build-online" > /etc/portage/package.use/strata'
          rc=0
          while IFS= read -r atom; do
            [[ -n "$atom" ]] || continue
            echo "building: $atom"
            docker exec gentoo \
              emerge --getbinpkg --buildpkg-exclude "$atom" \
              --autounmask --autounmask-write --autounmask-continue -v1 \
              "$atom" 2>&1 | tee -a build.log || rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              echo "build failed for $atom (rc=${rc})" >&2
              tail -80 build.log
              exit 1
            fi
          done <<< "${{ steps.atoms.outputs.atoms }}"
          echo "build succeeded"

      - name: Save deps
        if: always() && steps.atoms.outputs.atoms != ''
        continue-on-error: true
        uses: ./.github/actions/deps-save
        with:
          prefix: ci

  # the GPU engine variants (cuda / hip). default + desktop build the CPU engine
  # only, so a GPU-only break (a kernel that compiles under cuda/hip but not the
  # CPU path) is caught only here. The toolkits are ~amd64, so the throwaway
  # chroot accepts testing for them; a separate deps cache (ci-gpu) keeps that
  # testing toolchain out of the stable ci cache shared by default + desktop.
  gpu:
    needs: filter
    if: github.repository == 'PF4Public/gentoo-overlay' && needs.filter.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        use: [cuda, hip]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve atoms
        id: atoms
        shell: bash
        run: |
          set -euo pipefail
          # build the ebuilds the filter resolved for this package (the ones
          # changed directly or via a changed files/ entry, the live 9999 among
          # them when it changed). Same-slot versions (a release + the 9999)
          # are not mergeable in one emerge, so emit one atom per line and let
          # the Build step run one emerge per line.
          pkgdir="sci-misc/strata"
          atoms=""
          for e in ${{ needs.filter.outputs.ebuilds }}; do
            [[ "$e" == "$pkgdir"/*.ebuild ]] || continue
            eb=$(basename "$e" .ebuild)
            atoms+="=$pkgdir-${eb#$(basename "$pkgdir")-}"$'\n'
          done
          atoms=$(printf '%s' "$atoms" | sed '/^$/d' | sort -u)
          if [[ -z "$atoms" ]]; then
            echo "atoms=" >> "$GITHUB_OUTPUT"
            echo "no ebuild of $pkgdir to build"
            exit 0
          fi
          { echo "atoms<<EOATOMS"; echo "$atoms"; echo "EOATOMS"; } >> "$GITHUB_OUTPUT"
          echo "building:"; echo "$atoms" | sed 's/^/  /'

      - name: Free space
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/free-space

      - name: Restore deps
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/deps-restore
        with:
          prefix: ci-gpu

      - name: Gentoo setup
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/gentoo-setup
        with:
          accept-keywords: |
            sci-misc/strata *
            */* ~amd64

      - name: Configure GPU archs
        if: steps.atoms.outputs.atoms != ''
        shell: bash
        run: |
          # trim the GPU arch set so the heavy GPU deps build a few
          # representative archs instead of the full profile set: the free
          # 2-core/7GB runner OOMs on the full set (hipBLASLt's 14-arch
          # device-lib build was killed). The strata engine is already a fixed
          # small set (gfx1100;gfx1201 hip; a trimmed CUDA set), so the deps
          # only need to cover it.
          case "${{ matrix.use }}" in
            hip)
              # the ROCm deps build one arch per amdgpu_targets USE flag
              # (rocm.eclass USE_EXPAND), the official ones default on; keep
              # only the two the engine targets (gfx1100/gfx1201) and drop the
              # rest nothing else uses
              docker exec gentoo bash -c "F='-amdgpu_targets_gfx908 -amdgpu_targets_gfx90a -amdgpu_targets_gfx942 -amdgpu_targets_gfx950 -amdgpu_targets_gfx1030 -amdgpu_targets_gfx1101 -amdgpu_targets_gfx1102 -amdgpu_targets_gfx1103 -amdgpu_targets_gfx1150 -amdgpu_targets_gfx1151 -amdgpu_targets_gfx1152 -amdgpu_targets_gfx1153 -amdgpu_targets_gfx1200'; printf 'sci-libs/* %s\ndev-libs/* %s\ndev-util/* %s\n' \"\$F\" \"\$F\" \"\$F\" > /etc/portage/package.use/ci-gpu-arch"
              ;;
            cuda)
              docker exec gentoo bash -c "echo 'CUDA_ARCHITECTURES=\"86-real;89-real;120-real\"' >> /etc/portage/make.conf"
              ;;
          esac

      - name: Build (gpu)
        if: steps.atoms.outputs.atoms != ''
        shell: bash
        run: |
          set -uo pipefail
          docker exec gentoo bash -c \
            "echo \"sci-misc/strata ${{ matrix.use }}\" > /etc/portage/package.use/strata"
          rc=0
          while IFS= read -r atom; do
            [[ -n "$atom" ]] || continue
            echo "building: $atom"
            docker exec gentoo \
              emerge --getbinpkg --buildpkg-exclude "$atom" \
              --autounmask --autounmask-write --autounmask-continue -v1 \
              "$atom" 2>&1 | tee -a build.log || rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              echo "build failed for $atom (rc=${rc})" >&2
              tail -80 build.log
              exit 1
            fi
          done <<< "${{ steps.atoms.outputs.atoms }}"
          echo "build succeeded"

      - name: Save deps
        if: always() && steps.atoms.outputs.atoms != ''
        continue-on-error: true
        uses: ./.github/actions/deps-save
        with:
          prefix: ci-gpu
