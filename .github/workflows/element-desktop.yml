name: element-desktop
on:
  push:
    branches:
    - master
    paths:
    - 'net-im/element-desktop/*.ebuild'
    - 'net-im/element-desktop/files/**'
  pull_request:
    paths:
    - 'net-im/element-desktop/*.ebuild'
    - 'net-im/element-desktop/files/**'

jobs:
  filter:
    if: github.repository == 'PF4Public/gentoo-overlay'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.setup.outputs.build }}
      ebuilds: ${{ steps.setup.outputs.ebuilds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

  default:
    needs: filter
    if: github.repository == 'PF4Public/gentoo-overlay' && needs.filter.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          ebuilds: ${{ needs.filter.outputs.ebuilds }}

      - name: Free space
        uses: ./.github/actions/free-space

      - name: Restore cache
        uses: ./.github/actions/cache-restore
        with:
          restore-keys: |
            ${{ github.workflow }}
            element-web

      - name: Install ${{ github.workflow }} with default USE-flags
        uses: pf4public/gentoo-docker-action@master
        with:
            modified: ${{ steps.setup.outputs.ebuilds }}
            tool: ebuild
            action: install
            params: build-online

      - name: Save cache
        if: ${{ always() }}
        uses: ./.github/actions/cache-save

  ebuild:
    needs: [filter, default]
    if: github.repository == 'PF4Public/gentoo-overlay' && needs.filter.outputs.build == 'true'
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        use:
          - 'build-online'
        include:
          - use: '-build-online'
            experimental: true
          - use: 'electron_slot_43 -electron_slot_44 -electron_slot_45'
            experimental: true
          - use: '-electron_slot_43 electron_slot_44 -electron_slot_45'
            experimental: true
          - use: '-electron_slot_43 -electron_slot_44 electron_slot_45'
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          ebuilds: ${{ needs.filter.outputs.ebuilds }}

      - name: Free space
        uses: ./.github/actions/free-space

      - name: Restore cache
        uses: ./.github/actions/cache-restore
        with:
          restore-keys: |
            ${{ github.workflow }}
            element-web

      - name: Install ${{ github.workflow }} with "${{ matrix.use }}"
        uses: pf4public/gentoo-docker-action@master
        with:
            modified: ${{ steps.setup.outputs.ebuilds }}
            tool: ebuild
            action: install
            params: ${{ matrix.use }}
