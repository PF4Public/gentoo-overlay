name: llama-cpp
on:
  push:
    branches:
    - master
    paths:
    - 'sci-misc/llama-cpp/*.ebuild'
  pull_request:
    paths:
    - 'sci-misc/llama-cpp/*.ebuild'

jobs:
  default:
    if: github.repository == 'PF4Public/gentoo-overlay'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      - name: Restore cache
        uses: ./.github/actions/cache-restore

      - name: Install ${{ github.workflow }} with default USE-flags
        uses: pf4public/gentoo-docker-action@master
        with:
            modified: ${{ steps.setup.outputs.modified }}
            tool: ebuild
            action: compile
            params: ' '

      - name: Save cache
        if: ${{ always() }}
        uses: ./.github/actions/cache-save

  ebuild:
    needs: default
    if: github.repository == 'PF4Public/gentoo-overlay'
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - use: 'webui build-online'
            experimental: true
          - use: 'rpc'
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      - name: Restore cache
        uses: ./.github/actions/cache-restore

      - name: Install ${{ github.workflow }} with "${{ matrix.use }}"
        uses: pf4public/gentoo-docker-action@master
        with:
            modified: ${{ steps.setup.outputs.modified }}
            tool: ebuild
            action: compile
            params: ${{ matrix.use }}

      - name: Save cache
        if: ${{ always() }}
        uses: ./.github/actions/cache-save
