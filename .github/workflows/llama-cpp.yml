name: llama-cpp
on:
  push:
    branches:
    - master
    paths:
    - 'sci-misc/llama-cpp/*.ebuild'
    - 'sci-misc/llama-cpp/files/**'
  pull_request:
    paths:
    - 'sci-misc/llama-cpp/*.ebuild'
    - 'sci-misc/llama-cpp/files/**'

jobs:
  filter:
    if: github.repository == 'PF4Public/gentoo-overlay'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.setup.outputs.build }}
      ebuilds: ${{ steps.setup.outputs.ebuilds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

  build:
    needs: filter
    if: github.repository == 'PF4Public/gentoo-overlay' && needs.filter.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - use: ''
          - use: 'webui'
            experimental: true
          - use: 'rpc'
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve atoms
        id: atoms
        shell: bash
        run: |
          set -euo pipefail
          # build this package's newest release ebuild only: the filter's
          # resolved list can span other packages and several versions of
          # this one (a same-slot pair conflicts in one emerge), so derive
          # the atom from the package dir itself, skipping 9999 (KEYWORDS=""
          # is not mergeable)
          pkgdir="sci-misc/llama-cpp"
          eb=$(ls -1 "$pkgdir"/*.ebuild 2>/dev/null | grep -v -- '-9999.ebuild$' | sort -V | tail -n1 || true)
          if [[ -z "$eb" || ! -f "$eb" ]]; then
            echo "atoms=" >> "$GITHUB_OUTPUT"
            echo "no release ebuild in $pkgdir (9999-only), nothing to build"
            exit 0
          fi
          pv=$(basename "$eb" .ebuild | sed -E "s/^$(basename "$pkgdir")-//")
          atoms="=$pkgdir-$pv"
          echo "atoms=$atoms" >> "$GITHUB_OUTPUT"
          echo "building: $atoms"

      - name: Free space
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/free-space

      - name: Restore deps
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/deps-restore
        with:
          prefix: ci

      - name: Gentoo setup
        if: steps.atoms.outputs.atoms != ''
        uses: ./.github/actions/gentoo-setup
        with:
          accept-keywords: sci-misc/llama-cpp ~amd64

      - name: Build ${{ matrix.use || 'default' }}
        if: steps.atoms.outputs.atoms != ''
        shell: bash
        run: |
          set -uo pipefail
          # getbinpkg pulls the (stable) dependencies from the binhost, the
          # atom itself is built from source; default USE (no webui) is
          # fully offline
          # the matrix leg's USE combination (the default leg sets none)
          if [[ -n "${{ matrix.use }}" ]]; then
            docker exec gentoo bash -c 'mkdir -p /etc/portage/package.use && echo "sci-misc/llama-cpp ${{ matrix.use }}" > /etc/portage/package.use/llama-cpp'
          fi
          rc=0
          docker exec gentoo \
            emerge --getbinpkg --buildpkg-exclude "${{ steps.atoms.outputs.atoms }}" \
            --autounmask --autounmask-write --autounmask-continue -v1 \
            ${{ steps.atoms.outputs.atoms }} 2>&1 | tee build.log || rc=${PIPESTATUS[0]}
          if [[ $rc -ne 0 ]]; then
            echo "build failed (rc=${rc})" >&2
            tail -80 build.log
            exit 1
          fi
          echo "build succeeded"

      - name: Save deps
        if: always() && steps.atoms.outputs.atoms != ''
        continue-on-error: true
        uses: ./.github/actions/deps-save
        with:
          prefix: ci
